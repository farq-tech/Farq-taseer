[project]
name = "farq-individuals"
version = "0.1.0"
description = "FARQ for individuals: Haraj intent, retrieval, and request journey."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
farq-api = "farq.__main__:main"

[tool.vercel]
entrypoint = "src.farq.api:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: calls the public Haraj search endpoint"]
