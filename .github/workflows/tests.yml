name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Hermetic: no Haraj, no model, no mail. The live Haraj search tests are marked integration.
      FARQ_TEST_DATABASE_URL: postgresql://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Postgres search path (as production's taseer schema)
        run: PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -c "alter role postgres set search_path = taseer, public"
      - name: Tests
        run: python -m pytest -q -m "not integration"
